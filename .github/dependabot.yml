version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      laravel:
        patterns: ['laravel/*']
    ignore:
      # phpunit 13 braucht PHP 8.4, Server und Tests laufen mit PHP 8.3
      - dependency-name: phpunit/phpunit
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
